# §AR-ci.requirements.1.verification: isolated experiment; generated by
# scripts/node_cache_measure_workflow.py from the complete production jobs.
name: Node cache native measurement
'on':
  workflow_call:
    inputs:
      configuration:
        description: Immutable source/harness, condition (seed/exact/save), seed_run and sample label JSON
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  node:
    name: node acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Preserve the independent harness
      shell: bash
      run: |
        python - <<'PY'
        import os, pathlib, shutil
        out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "grund-1122-tools"
        out.mkdir()
        for name in ("node_cache_measure.py", "node_cache_measure_archive.cjs"):
            shutil.copy2(pathlib.Path("scripts") / name, out / name)
        PY
    - uses: actions/checkout@v6
      with:
        ref: ${{ fromJSON(inputs.configuration).source }}
        fetch-depth: 0
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.x
    - name: Install Node
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
    - name: Install binding Rust toolchain
      run: rustup toolchain install 1.95.0 --profile minimal
    - name: Install isolated archive tools
      shell: bash
      run: |
        python -m pip install PyYAML==6.0.2
        npm install --prefix "${{ runner.temp }}/grund-1122-tools" --ignore-scripts --no-audit --no-fund @actions/cache@5.1.0
    - name: Download matched isolated seeds
      if: ${{ fromJSON(inputs.configuration).condition != 'seed' }}
      uses: actions/download-artifact@v5
      with:
        name: ${{ runner.os }}-seeds
        path: ${{ runner.temp }}/grund-1122-measure/seeds
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ fromJSON(inputs.configuration).seed_run }}
    - name: Restore cargo registry and target
      shell: bash
      run: python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" restore cargo
      id: cargo
    - name: Restore the Node acceptance's build target
      shell: bash
      run: python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" restore node-target
      id: node-target
    - name: Materialize Node dependencies
      if: ${{ fromJSON(inputs.configuration).source != 'd338c4814a095fef54708e83367597c4e7955aad' }}
      run: python scripts/node_cache_publication.py restore
    - name: Restore the Node acceptance's TypeScript compiler
      shell: bash
      run: python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" restore node-typescript
      id: node-typescript
    - name: Prepare same-source binding oracle
      run: python scripts/prepare_binding_oracle.py
    - name: node acceptance
      run: python scripts/run_python_gate.py --only-node-acceptance
    - if: ${{ fromJSON(inputs.configuration).condition != 'exact' }}
      shell: bash
      run: bash scripts/prune_cargo_cache.sh
    - name: Save cargo registry and target
      shell: bash
      run: python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" save cargo
      if: ${{ fromJSON(inputs.configuration).condition != 'exact' }}
    - name: Prepare Node dependency publication
      id: node-publication
      if: ${{ fromJSON(inputs.configuration).source != 'd338c4814a095fef54708e83367597c4e7955aad' && fromJSON(inputs.configuration).condition != 'exact' }}
      run: python scripts/node_cache_publication.py prepare
    - name: Save the Node acceptance's build target
      shell: bash
      run: |-
        if [ "${{ fromJSON(inputs.configuration).source }}" != "d338c4814a095fef54708e83367597c4e7955aad" ]; then
          [ "${{ steps.node-publication.outputs.ready }}" = true ] || exit 1
        fi
        python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" save node-target
      if: ${{ fromJSON(inputs.configuration).condition != 'exact' }}
    - name: Save the Node acceptance's TypeScript compiler
      shell: bash
      run: python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" save node-typescript
      if: ${{ fromJSON(inputs.configuration).condition != 'exact' }}
    - name: Upload isolated seeds or save-path transfer
      if: ${{ fromJSON(inputs.configuration).condition != 'exact' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-seeds
        path: ${{ runner.temp }}/grund-1122-measure/seeds
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
    - name: Retain measurement evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-evidence
        path: ${{ runner.temp }}/grund-1122-measure/evidence
        retention-days: 7
        if-no-files-found: error
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -D warnings
      PYTHONUTF8: '1'
      MEASURE_WORKFLOW: ci-leg.yml
      MEASURE_JOB: node
      MEASURE_CONFIG: ${{ inputs.configuration }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
  macos:
    name: suites (macos-latest)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Preserve the independent harness
      shell: bash
      run: |
        python - <<'PY'
        import os, pathlib, shutil
        out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "grund-1122-tools"
        out.mkdir()
        for name in ("node_cache_measure.py", "node_cache_measure_archive.cjs"):
            shutil.copy2(pathlib.Path("scripts") / name, out / name)
        PY
    - uses: actions/checkout@v6
      with:
        ref: ${{ fromJSON(inputs.configuration).source }}
        fetch-depth: 0
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.x
    - name: Install Node
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
    - name: Install binding Rust toolchain
      run: rustup toolchain install 1.95.0 --profile minimal
    - name: Install isolated archive tools
      shell: bash
      run: |
        python -m pip install PyYAML==6.0.2
        npm install --prefix "${{ runner.temp }}/grund-1122-tools" --ignore-scripts --no-audit --no-fund @actions/cache@5.1.0
    - name: Download matched isolated seeds
      if: ${{ fromJSON(inputs.configuration).condition != 'seed' }}
      uses: actions/download-artifact@v5
      with:
        name: ${{ runner.os }}-seeds
        path: ${{ runner.temp }}/grund-1122-measure/seeds
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ fromJSON(inputs.configuration).seed_run }}
    - name: Restore cargo registry and target
      shell: bash
      run: python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" restore cargo
      id: cargo
    - name: Restore the Node acceptance's build target
      shell: bash
      run: python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" restore node-target
      id: node-target
    - name: Materialize Node dependencies
      if: ${{ fromJSON(inputs.configuration).source != 'd338c4814a095fef54708e83367597c4e7955aad' }}
      run: python scripts/node_cache_publication.py restore
    - name: Restore the Node acceptance's TypeScript compiler
      shell: bash
      run: python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" restore node-typescript
      id: node-typescript
    - name: cargo fmt --check
      run: cargo fmt --all -- --check
    - name: native watch contract
      run: python scripts/run_cargo_suite.py -p grund --features test-watch --test check_watch_observer --locked
    - name: Install fissile
      run: cargo install fissile --version 0.8.3 --locked --quiet
    - name: Prepare same-source binding oracle
      run: python scripts/prepare_binding_oracle.py
    - name: python tests
      run: python scripts/run_python_gate.py --rest
    - name: node acceptance
      run: python scripts/run_python_gate.py --only-node-acceptance
    - name: python acceptance
      run: python scripts/run_python_gate.py --only-python-acceptance
    - name: slow python tests
      run: python scripts/run_python_gate.py --only-slow
    - name: cargo build
      run: cargo build --quiet --workspace --all-targets --locked
    - name: grund self-check
      shell: bash
      run: |
        # `--full` (§FS-check.1.3) walks past `[scan] include` as well, so a citation this
        # repository's own config forgot to cover — examples/ is deliberately outside it —
        # fails CI instead of accumulating unseen.

        # The 30s ceiling is the catastrophic-regression guard (§AR-ci.4 /
        # §GOAL-fast-feedback); the `bench` job (§AR-benchmarks / §AR-ci.5) is the precise
        # meter. Python, not GNU `timeout`, so the same step runs on all three platforms.
        python - <<'PY'
        import subprocess
        import sys

        try:
            result = subprocess.run(
                ["cargo", "run", "--quiet", "--locked", "--", "check", ".", "--format", "json", "--full"],
                stdout=subprocess.PIPE,
                timeout=30,
            )
        except subprocess.TimeoutExpired:
            print("grund self-check exceeded 30s", file=sys.stderr)
            sys.exit(124)

        if result.returncode != 0:
            sys.exit(result.returncode)
        if result.stdout:
            print("grund self-check wrote unexpected stdout:", file=sys.stderr)
            sys.stderr.buffer.write(result.stdout)
            sys.exit(1)
        PY
    - name: cargo test 1/4
      run: python scripts/run_cargo_suite.py --shard 1/4 --workspace --all-targets --locked --features grund/test-workspace-load-count
    - name: cargo test 2/4
      run: python scripts/run_cargo_suite.py --shard 2/4 --workspace --all-targets --locked --features grund/test-workspace-load-count
    - name: cargo test 3/4
      run: python scripts/run_cargo_suite.py --shard 3/4 --workspace --all-targets --locked --features grund/test-workspace-load-count
    - name: cargo test 4/4
      run: python scripts/run_cargo_suite.py --shard 4/4 --workspace --all-targets --locked --features grund/test-workspace-load-count
    - if: ${{ fromJSON(inputs.configuration).condition != 'exact' }}
      run: bash scripts/prune_cargo_cache.sh
    - name: Save cargo registry and target
      shell: bash
      run: python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" save cargo
      if: ${{ fromJSON(inputs.configuration).condition != 'exact' }}
    - name: Prepare Node dependency publication
      id: node-publication
      if: ${{ fromJSON(inputs.configuration).source != 'd338c4814a095fef54708e83367597c4e7955aad' && fromJSON(inputs.configuration).condition != 'exact' }}
      run: python scripts/node_cache_publication.py prepare
    - name: Save the Node acceptance's build target
      shell: bash
      run: |-
        if [ "${{ fromJSON(inputs.configuration).source }}" != "d338c4814a095fef54708e83367597c4e7955aad" ]; then
          [ "${{ steps.node-publication.outputs.ready }}" = true ] || exit 1
        fi
        python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" save node-target
      if: ${{ fromJSON(inputs.configuration).condition != 'exact' }}
    - name: Save the Node acceptance's TypeScript compiler
      shell: bash
      run: python "${{ runner.temp }}/grund-1122-tools/node_cache_measure.py" save node-typescript
      if: ${{ fromJSON(inputs.configuration).condition != 'exact' }}
    - name: Upload isolated seeds or save-path transfer
      if: ${{ fromJSON(inputs.configuration).condition != 'exact' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-seeds
        path: ${{ runner.temp }}/grund-1122-measure/seeds
        compression-level: 0
        retention-days: 7
        if-no-files-found: error
    - name: Retain measurement evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-evidence
        path: ${{ runner.temp }}/grund-1122-measure/evidence
        retention-days: 7
        if-no-files-found: error
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -D warnings
      PYTHONUTF8: '1'
      MEASURE_WORKFLOW: macos-suites.yml
      MEASURE_JOB: macos
      MEASURE_CONFIG: ${{ inputs.configuration }}
