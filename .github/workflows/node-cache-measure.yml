# §AR-ci.requirements.1.verification: isolated service experiment; generated by
# scripts/node_cache_measure_workflow.py from complete production jobs.
name: Node cache native measurement
'on':
  workflow_call:
    inputs:
      configuration:
        description: Explicit mode, pinned pair/harness, OS, seed_run/attempt, condition and label JSON
        required: true
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: grund-1122-experiment
  cancel-in-progress: false
jobs:
  node:
    name: node acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Preserve the independent pinned harness
      shell: bash
      run: |
        python - <<'PY'
        import os, pathlib, shutil
        out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "grund-1122-tools"
        out.mkdir()
        for source in pathlib.Path("scripts").glob("node_cache_*.py"):
            shutil.copy2(source, out / source.name)
        shutil.copy2("scripts/node_cache_measure_service.cjs", out)
        for source in pathlib.Path("scripts/node-cache-toolkit").iterdir():
            if source.is_file(): shutil.copy2(source, out / source.name)
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
            environment.write(f"MEASURE_TOOLS={out.as_posix()}\n")
        PY
    - uses: actions/checkout@v6
      with:
        ref: ${{ fromJSON(inputs.configuration).source }}
        fetch-depth: 0
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.x
    - name: Install Node
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
    - name: Install binding Rust toolchain
      run: rustup toolchain install 1.95.0 --profile minimal
    - name: Install pinned experimental cache toolkit
      shell: bash
      run: |
        python -m pip install PyYAML==6.0.2
        npm ci --prefix "${{ env.MEASURE_TOOLS }}" --ignore-scripts --no-audit --no-fund
    - name: Verify scope and plan every cache identity
      shell: bash
      run: python "${{ env.MEASURE_TOOLS }}/node_cache_measure.py" initialize
    - name: Persist the pre-write intention ledger
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-${{ github.run_attempt }}-ledger
        path: ${{ runner.temp }}/grund-1122-measure/evidence/ledger.json
        retention-days: 14
        if-no-files-found: error
    - name: Download exact seed provenance (no archive artifacts)
      if: ${{ fromJSON(inputs.configuration).condition != 'seed' }}
      uses: actions/download-artifact@v5
      with:
        name: ${{ runner.os }}-${{ fromJSON(inputs.configuration).seed_attempt }}-evidence
        path: ${{ runner.temp }}/grund-1122-measure/seeds
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ fromJSON(inputs.configuration).seed_run }}
    - name: Restore cargo registry and target
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''restore'', ''cargo''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      id: cargo
    - name: Restore the Node acceptance's build target
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''restore'', ''node-target''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      id: node-target
    - name: Materialize Node dependencies
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' && fromJSON(inputs.configuration).source != 'd338c4814a095fef54708e83367597c4e7955aad' && steps.node-target.outputs.cache-matched-key != '' }}
      run: python scripts/node_cache_publication.py restore
    - name: Restore the Node acceptance's TypeScript compiler
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''restore'', ''node-typescript''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      id: node-typescript
    - name: Prepare same-source binding oracle
      run: python scripts/prepare_binding_oracle.py
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: node acceptance
      run: python scripts/run_python_gate.py --only-node-acceptance
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - if: ${{ fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save' }}
      shell: bash
      run: bash scripts/prune_cargo_cache.sh
    - name: Save cargo registry and target
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''save'', ''cargo''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      if: ${{ fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save' }}
    - name: Prepare Node dependency publication
      id: node-publication
      if: ${{ (fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save') && fromJSON(inputs.configuration).source != 'd338c4814a095fef54708e83367597c4e7955aad' }}
      run: python scripts/node_cache_publication.py prepare
    - name: Save the Node acceptance's build target
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''save'', ''node-target''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      if: ${{ (fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save') && (fromJSON(inputs.configuration).source == 'd338c4814a095fef54708e83367597c4e7955aad' || steps.node-publication.outputs.ready == 'true') }}
    - name: Save the Node acceptance's TypeScript compiler
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''save'', ''node-typescript''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      if: ${{ fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save' }}
    - name: Validate repeated native cache-service round trips
      uses: actions/github-script@v8
      if: ${{ fromJSON(inputs.configuration).condition == 'validate' }}
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''validate''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
    - name: Require complete Node publication in save samples
      shell: bash
      if: ${{ (fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save') && fromJSON(inputs.configuration).source != 'd338c4814a095fef54708e83367597c4e7955aad' }}
      run: '[ "${{ steps.node-publication.outputs.ready }}" = true ]'
    - name: Retain all transaction and gate evidence before cleanup
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-${{ github.run_attempt }}-evidence
        path: ${{ runner.temp }}/grund-1122-measure/evidence
        retention-days: 14
        if-no-files-found: error
    - name: Delete exactly this batch (retain only successful seeds)
      if: ${{ always() && (fromJSON(inputs.configuration).condition != 'seed' || failure() || cancelled()) }}
      shell: bash
      run: python "${{ env.MEASURE_TOOLS }}/node_cache_measure.py" cleanup-local
    - name: Retain cleanup identities and absence checks
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-${{ github.run_attempt }}-cleanup
        path: ${{ runner.temp }}/grund-1122-measure/evidence
        retention-days: 14
        if-no-files-found: error
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -D warnings
      PYTHONUTF8: '1'
      MEASURE_WORKFLOW: ci-leg.yml
      MEASURE_JOB: node
      MEASURE_CONFIG: ${{ inputs.configuration }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    if: ${{ fromJSON(inputs.configuration).os != 'macOS' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.configuration).node_systems }}
  macos:
    name: suites (macos-latest)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Preserve the independent pinned harness
      shell: bash
      run: |
        python - <<'PY'
        import os, pathlib, shutil
        out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "grund-1122-tools"
        out.mkdir()
        for source in pathlib.Path("scripts").glob("node_cache_*.py"):
            shutil.copy2(source, out / source.name)
        shutil.copy2("scripts/node_cache_measure_service.cjs", out)
        for source in pathlib.Path("scripts/node-cache-toolkit").iterdir():
            if source.is_file(): shutil.copy2(source, out / source.name)
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
            environment.write(f"MEASURE_TOOLS={out.as_posix()}\n")
        PY
    - uses: actions/checkout@v6
      with:
        ref: ${{ fromJSON(inputs.configuration).source }}
        fetch-depth: 0
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.x
    - name: Install Node
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
    - name: Install binding Rust toolchain
      run: rustup toolchain install 1.95.0 --profile minimal
    - name: Install pinned experimental cache toolkit
      shell: bash
      run: |
        python -m pip install PyYAML==6.0.2
        npm ci --prefix "${{ env.MEASURE_TOOLS }}" --ignore-scripts --no-audit --no-fund
    - name: Verify scope and plan every cache identity
      shell: bash
      run: python "${{ env.MEASURE_TOOLS }}/node_cache_measure.py" initialize
    - name: Persist the pre-write intention ledger
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-${{ github.run_attempt }}-ledger
        path: ${{ runner.temp }}/grund-1122-measure/evidence/ledger.json
        retention-days: 14
        if-no-files-found: error
    - name: Download exact seed provenance (no archive artifacts)
      if: ${{ fromJSON(inputs.configuration).condition != 'seed' }}
      uses: actions/download-artifact@v5
      with:
        name: ${{ runner.os }}-${{ fromJSON(inputs.configuration).seed_attempt }}-evidence
        path: ${{ runner.temp }}/grund-1122-measure/seeds
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ fromJSON(inputs.configuration).seed_run }}
    - name: Restore cargo registry and target
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''restore'', ''cargo''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      id: cargo
    - name: Restore the Node acceptance's build target
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''restore'', ''node-target''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      id: node-target
    - name: Materialize Node dependencies
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' && fromJSON(inputs.configuration).source != 'd338c4814a095fef54708e83367597c4e7955aad' && steps.node-target.outputs.cache-matched-key != '' }}
      run: python scripts/node_cache_publication.py restore
    - name: Restore the Node acceptance's TypeScript compiler
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''restore'', ''node-typescript''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      id: node-typescript
    - name: cargo fmt --check
      run: cargo fmt --all -- --check
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: native watch contract
      run: python scripts/run_cargo_suite.py -p grund --features test-watch --test check_watch_observer --locked
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: Install fissile
      run: cargo install fissile --version 0.8.3 --locked --quiet
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: Prepare same-source binding oracle
      run: python scripts/prepare_binding_oracle.py
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: python tests
      run: python scripts/run_python_gate.py --rest
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: node acceptance
      run: python scripts/run_python_gate.py --only-node-acceptance
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: python acceptance
      run: python scripts/run_python_gate.py --only-python-acceptance
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: slow python tests
      run: python scripts/run_python_gate.py --only-slow
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: cargo build
      run: cargo build --quiet --workspace --all-targets --locked
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: grund self-check
      shell: bash
      run: |
        # `--full` (§FS-check.1.3) walks past `[scan] include` as well, so a citation this
        # repository's own config forgot to cover — examples/ is deliberately outside it —
        # fails CI instead of accumulating unseen.

        # The 30s ceiling is the catastrophic-regression guard (§AR-ci.4 /
        # §GOAL-fast-feedback); the `bench` job (§AR-benchmarks / §AR-ci.5) is the precise
        # meter. Python, not GNU `timeout`, so the same step runs on all three platforms.
        python - <<'PY'
        import subprocess
        import sys

        try:
            result = subprocess.run(
                ["cargo", "run", "--quiet", "--locked", "--", "check", ".", "--format", "json", "--full"],
                stdout=subprocess.PIPE,
                timeout=30,
            )
        except subprocess.TimeoutExpired:
            print("grund self-check exceeded 30s", file=sys.stderr)
            sys.exit(124)

        if result.returncode != 0:
            sys.exit(result.returncode)
        if result.stdout:
            print("grund self-check wrote unexpected stdout:", file=sys.stderr)
            sys.stderr.buffer.write(result.stdout)
            sys.exit(1)
        PY
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: cargo test 1/4
      run: python scripts/run_cargo_suite.py --shard 1/4 --workspace --all-targets --locked --features grund/test-workspace-load-count
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: cargo test 2/4
      run: python scripts/run_cargo_suite.py --shard 2/4 --workspace --all-targets --locked --features grund/test-workspace-load-count
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: cargo test 3/4
      run: python scripts/run_cargo_suite.py --shard 3/4 --workspace --all-targets --locked --features grund/test-workspace-load-count
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - name: cargo test 4/4
      run: python scripts/run_cargo_suite.py --shard 4/4 --workspace --all-targets --locked --features grund/test-workspace-load-count
      if: ${{ fromJSON(inputs.configuration).condition != 'validate' }}
    - if: ${{ fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save' }}
      run: bash scripts/prune_cargo_cache.sh
    - name: Save cargo registry and target
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''save'', ''cargo''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      if: ${{ fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save' }}
    - name: Prepare Node dependency publication
      id: node-publication
      if: ${{ (fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save') && fromJSON(inputs.configuration).source != 'd338c4814a095fef54708e83367597c4e7955aad' }}
      run: python scripts/node_cache_publication.py prepare
    - name: Save the Node acceptance's build target
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''save'', ''node-target''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      if: ${{ (fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save') && (fromJSON(inputs.configuration).source == 'd338c4814a095fef54708e83367597c4e7955aad' || steps.node-publication.outputs.ready == 'true') }}
    - name: Save the Node acceptance's TypeScript compiler
      uses: actions/github-script@v8
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''save'', ''node-typescript''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
      if: ${{ fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save' }}
    - name: Validate repeated native cache-service round trips
      uses: actions/github-script@v8
      if: ${{ fromJSON(inputs.configuration).condition == 'validate' }}
      with:
        script: 'await exec.exec(''python'', [process.env.MEASURE_TOOLS + ''/node_cache_measure.py'', ''validate''], {env: {...process.env, MEASURE_NODE: process.execPath}});'
    - name: Require complete Node publication in save samples
      shell: bash
      if: ${{ (fromJSON(inputs.configuration).condition == 'seed' || fromJSON(inputs.configuration).condition == 'save') && fromJSON(inputs.configuration).source != 'd338c4814a095fef54708e83367597c4e7955aad' }}
      run: '[ "${{ steps.node-publication.outputs.ready }}" = true ]'
    - name: Retain all transaction and gate evidence before cleanup
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-${{ github.run_attempt }}-evidence
        path: ${{ runner.temp }}/grund-1122-measure/evidence
        retention-days: 14
        if-no-files-found: error
    - name: Delete exactly this batch (retain only successful seeds)
      if: ${{ always() && (fromJSON(inputs.configuration).condition != 'seed' || failure() || cancelled()) }}
      shell: bash
      run: python "${{ env.MEASURE_TOOLS }}/node_cache_measure.py" cleanup-local
    - name: Retain cleanup identities and absence checks
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-${{ github.run_attempt }}-cleanup
        path: ${{ runner.temp }}/grund-1122-measure/evidence
        retention-days: 14
        if-no-files-found: error
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -D warnings
      PYTHONUTF8: '1'
      MEASURE_WORKFLOW: macos-suites.yml
      MEASURE_JOB: macos
      MEASURE_CONFIG: ${{ inputs.configuration }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    if: ${{ fromJSON(inputs.configuration).os == 'macOS' }}
