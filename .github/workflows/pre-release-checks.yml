# The manually dispatched release gate complements §AR-ci.
name: Pre-release checks

on:
  workflow_dispatch:
    inputs:
      # §AR-ci.requirements.1.verification: registered dispatch for the isolated fork experiment.
      node-cache-experiment:
        description: "#1122 measurement configuration JSON; empty runs the ordinary release checks"
        type: string
        default: ""

run-name: ${{ inputs.node-cache-experiment != '' && format('Node cache 1122 {0}', fromJSON(inputs.node-cache-experiment).label) || 'Pre-release checks' }}

env:
  # §AR-ci.13.6: no incremental state is written, so none reaches a cargo cache.
  CARGO_INCREMENTAL: 0

jobs:
  registry-names:
    if: inputs.node-cache-experiment == ''
    name: verify package-name availability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check package names
        run: bash scripts/check-registry-names.sh

  pgo-release-binary:
    if: inputs.node-cache-experiment == ''
    name: build and self-check PGO release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-profdata, used by scripts/pgo-build.sh to merge the .profraw profiles.
          components: llvm-tools-preview

      # §AR-ci.13.6: a dispatch never saves, so its own key never hits; the `-cargo-`
      # fallback restores what it can of main's Linux cargo caches.
      - name: Restore cargo registry and target
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-prerelease-pgo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-prerelease-pgo-
            ${{ runner.os }}-cargo-

      - name: Build PGO release binary
        run: bash scripts/pgo-build.sh

      - name: Self-check PGO release binary
        run: |
          out="$(./target/release/grund check . --format json)"
          if [ -n "$out" ]; then
            echo "PGO grund self-check wrote unexpected stdout:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi

  # §AR-ci.5.4: the whole catalog passes its ceilings before a release ships.
  nightly-benchmarks:
    if: inputs.node-cache-experiment == ''
    uses: ./.github/workflows/bench-nightly.yml

  # §AR-ci.requirements.1.verification: no production events or cache publication.
  node-cache-experiment:
    if: inputs.node-cache-experiment != '' && github.repository == 'vjovanov/grund-fork'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/node-cache-measure.yml
    with:
      configuration: ${{ inputs.node-cache-experiment }}
